# A lerd plugin. Every key except api_version and name is optional: delete the
# surfaces you don't need. Reference: https://lerd.sh/features/plugins
api_version: 1
name: hello
version: 0.1.0
description: A starting point for a lerd plugin

# Shown on the plugin's Documentation tab in the dashboard, offline. Keep the
# README for the repository; this is what someone reads once it is installed.
docs: DOCS.md
# Drawn on its card in the dashboard; one colour, since it is used as a mask.
icon: ui/icon.svg

# `lerd hello:greet [site]`
commands:
  - name: greet
    usage: Print a greeting for a site
    run: bin/greet
  # `lerd hello:sites`, an example of calling lerd's own API.
  - name: sites
    usage: List lerd's sites through its API
    run: bin/sites
  # `lerd hello:notify`, an example of telling the user something.
  - name: notify
    usage: Send the user a notification
    run: bin/notify


# Commands the scripts call beyond their interpreters; bin/sites uses curl.
requires: [curl]
# It may send notifications, which lerd asks the user to allow at install.
notifications: true
# Shown in the site's Commands menu and the command palette.
site_commands:
  - name: greet
    label: Greet
    description: Print a greeting for this site
    run: bin/greet

# Event name -> executable. The event payload arrives as JSON on stdin.
hooks:
  site.linked: bin/on-event
  site.unlinked: bin/on-event

# Tools for AI assistants, exposed by `lerd mcp` as hello_greet.
mcp:
  skill: SKILL.md
  tools:
    - name: greet
      description: Return a greeting for a lerd site
      input_schema:
        type: object
        properties:
          site:
            type: string
            description: Site name
      run: bin/greet

# Served at /api/plugins/hello/greet, behind the same access rules as lerd's own API.
api:
  - path: greet
    methods: [GET]
    run: bin/greet

ui:
  page:
    title: Hello
    icon: ui/icon.svg
    entry: ui/index.html
  # Optional modal action, shown only for an active native public share.
  # Context: site, domain, branch (native slug), intent=access, lang.
  # share_action: {title: Access rules, entry: ui/site.html}
  site_tab:
    title: Hello
    entry: ui/site.html
  # A card on a site's Overview, once switched on for that site; it grows to fit.
  overview_card:
    title: Hello
    entry: ui/card.html
  # Injected into a site's pages once switched on for that site, never before.
  page_script: ui/page.js
